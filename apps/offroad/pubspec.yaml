name: offroad
description: Offline trail maps for Fiji.
publish_to: none
version: 0.3.1+6
environment:
  sdk: ^3.10.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  flutter_map: ^8.3.2
  flutter_riverpod: ^3.5.0
  latlong2: ^0.10.0
  path_provider: ^2.1.6
  offroad_core:
    path: ../../packages/core
  offroad_maps:
    path: ../../packages/maps
  offroad_platform:
    path: ../../packages/platform
  offroad_storage:
    path: ../../packages/storage
dev_dependencies:
  sqlite3: ^3.9.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fiji.mbtiles
    - assets/fiji-roads.sqlite
    - assets/fiji-satellite.mbtiles
    - assets/map-license.txt
